<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技搞钱看板</title>
<style>
/* SECTION: base */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#131825;--card-border:#1e2a3a;
  --accent:#00d4aa;--accent-dim:rgba(0,212,170,.15);
  --warn:#ff6b35;--warn-dim:rgba(255,107,53,.15);
  --up:#ff4d4d;--down:#00c853;--neutral:#5b8def;
  --text:#e8ecf1;--text-dim:#8892a4;--text-muted:#4a5568;
  --glow:0 0 20px rgba(0,212,170,.08);
  --radius:12px;
}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6}

/* SECTION: ticker */
.ticker-wrap{background:#0d1119;border-bottom:1px solid var(--card-border);overflow:hidden;height:36px;display:flex;align-items:center}
.ticker-track{display:flex;gap:40px;animation:ticker 30s linear infinite;white-space:nowrap;padding:0 20px}
.ticker-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim)}
.ticker-item .t-name{color:var(--text-muted)}
.ticker-item .t-val{color:var(--text)}
.ticker-item .t-chg{font-weight:600;font-family:'Courier New',monospace}
.t-up{color:var(--up)!important}
.t-down{color:var(--down)!important}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* SECTION: header */
.header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--card-border)}
.logo-area{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#0088ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.logo-text{font-size:20px;font-weight:700;letter-spacing:1px}
.logo-text span{color:var(--accent)}
.clock{font-size:13px;color:var(--text-dim);font-family:'Courier New',monospace}

.track-tabs{display:flex;gap:8px;flex-wrap:wrap}
.track-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--card-border);background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:5px;user-select:none}
.track-tab:hover{border-color:var(--accent);color:var(--text)}
.track-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.track-tab .tab-icon{font-size:14px}

/* SECTION: section nav */
.section-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* SECTION: search */
.search-wrap{padding:14px 24px 0;max-width:1600px;margin:0 auto;position:relative}
.search-box{position:relative;display:flex;align-items:center;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:0 14px;transition:border-color .25s,box-shadow .25s}
.search-box:focus-within{border-color:var(--accent);box-shadow:var(--glow)}
.search-box .search-icon{font-size:15px;color:var(--text-muted);flex-shrink:0}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;padding:12px 10px;font-family:inherit}
.search-box input::placeholder{color:var(--text-muted)}
.search-clear{display:none;background:rgba(255,255,255,.08);border:none;color:var(--text-dim);font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.search-clear.show{display:block}
.search-suggest{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:#1a2133;border:1px solid var(--card-border);border-radius:12px;padding:6px;z-index:80;box-shadow:0 16px 40px rgba(0,0,0,.6);max-height:320px;overflow-y:auto}
.search-suggest.open{display:block}
.sg-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;transition:background .15s}
.sg-item:hover,.sg-item.cursor{background:rgba(0,212,170,.12)}
.sg-item .sg-icon{font-size:16px}
.sg-item .sg-name{font-size:13px;color:var(--text)}
.sg-item .sg-alias{font-size:11px;color:var(--text-muted);margin-left:auto}
.sg-empty{padding:12px;font-size:12px;color:var(--text-muted);text-align:center}
.search-mode-tag{display:none;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--accent)}
.search-mode-tag.show{display:flex}
.search-mode-tag .smt-exit{cursor:pointer;color:var(--text-dim);text-decoration:underline;font-size:11px}
.search-mode-tag .smt-exit:hover{color:var(--warn)}
.nav-chip{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:18px;border:1px solid var(--card-border);background:var(--card);color:var(--text-dim);font-size:12px;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,color .22s ease;user-select:none;white-space:nowrap}
.nav-chip .nav-dot{width:6px;height:6px;border-radius:50%;box-shadow:0 0 6px currentColor}
.nav-chip:hover{transform:scale(1.06);border-color:var(--accent);color:var(--accent);box-shadow:var(--glow)}
.nav-chip:active{transform:scale(.97)}
html{scroll-behavior:smooth}
#secNews,#secInterpret,#secMarket,#secAlerts{scroll-margin-top:16px}

/* SECTION: layout */
.main{padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1600px;margin:0 auto}
@media(max-width:1024px){.main{grid-template-columns:1fr}}

/* SECTION: cards */
.section-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;transition:all .3s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.3}
.card:hover{box-shadow:var(--glow);border-color:rgba(0,212,170,.3)}

/* SECTION: track news */
.track-group{margin-bottom:20px}
.track-group-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--card-border)}
.track-group-header .track-emoji{font-size:20px}
.track-group-header .track-name{font-size:15px;font-weight:600;color:var(--accent)}
.track-group-header .track-count{font-size:11px;color:var(--text-muted);margin-left:auto}

.news-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.news-item:last-child{border-bottom:none}
.news-type-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
.news-type-icon.type-news{background:rgba(91,143,239,.15);color:var(--neutral)}
.news-type-icon.type-policy{background:var(--warn-dim);color:var(--warn)}
.news-type-icon.type-company{background:var(--accent-dim);color:var(--accent)}
.news-content{flex:1;min-width:0}
.news-title{font-size:13px;line-height:1.5;color:var(--text)}
.news-title.highlight{color:var(--warn);font-weight:600}
.news-meta{display:flex;gap:12px;margin-top:4px;font-size:11px;color:var(--text-muted)}

/* SECTION: interpret */
.interpret-card{margin-bottom:14px;border-left:3px solid;padding-left:14px}
.interpret-card.positive{border-color:var(--up);background:rgba(255,77,77,.04)}
.interpret-card.negative{border-color:var(--down);background:rgba(0,200,83,.04)}
.interpret-card.neutral{border-color:var(--neutral);background:rgba(91,143,239,.04)}
.interpret-title{font-size:14px;font-weight:600;margin-bottom:8px}
.interpret-section{margin-bottom:8px}
.interpret-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:600}
.interpret-plain{font-size:13px;color:var(--text);line-height:1.6}
.interpret-tags{display:flex;flex-wrap:wrap;gap:6px}
.interpret-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.06);color:var(--text-dim)}
.interpret-outlook{font-size:12px;color:var(--text-dim);line-height:1.5;font-style:italic}
.card.interpret-card{overflow:visible;z-index:1}
.card.interpret-card:hover{z-index:30}
.interpret-sources{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
.source-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.source-label{font-size:11px;color:var(--text-muted);font-weight:600;flex-shrink:0}
.source-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:8px;background:rgba(0,212,170,.1);color:var(--accent);cursor:pointer;text-decoration:none;border:1px solid rgba(0,212,170,.25);transition:all .2s;white-space:nowrap}
.source-chip:hover{background:var(--accent-dim);border-color:var(--accent)}
.source-chip .s-kind{font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(0,212,170,.18)}
.source-chip .s-arrow{font-size:10px;opacity:.7}
.source-multi{position:relative;display:inline-flex}
.source-dropdown{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:280px;background:#1a2133;border:1px solid var(--card-border);border-radius:10px;padding:6px;z-index:60;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.source-multi:hover .source-dropdown{display:block}
.source-dropdown::before{content:'';position:absolute;top:-8px;left:0;right:0;height:8px}
.source-opt{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--text);transition:background .15s}
.source-opt:hover{background:rgba(0,212,170,.14)}
.so-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.so-org{font-size:13px;font-weight:600}
.so-badge{font-size:10px;padding:1px 7px;border-radius:10px;flex-shrink:0}
.badge-origin{background:rgba(0,212,170,.18);color:var(--accent)}
.badge-authority{background:rgba(91,143,239,.18);color:var(--neutral)}
.badge-hot{background:var(--warn-dim);color:var(--warn)}
.so-note{font-size:11px;color:var(--text-dim)}
.so-url{font-size:10px;color:var(--text-muted);font-family:'Courier New',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}

/* SECTION: alert sources */
.alert-item{overflow:visible;z-index:1}
.alert-item:hover{z-index:40}
.alerts-panel .interpret-sources{margin-top:8px;padding-top:8px}
.alerts-panel .source-bar{gap:6px}
.alerts-panel .source-multi{width:100%}
.alerts-panel .source-chip{width:100%;justify-content:flex-start}
.alerts-panel .source-dropdown{left:auto;right:0;min-width:240px;max-width:280px}

/* SECTION: plain guide */
.guide-panel{grid-column:1/-1;margin-top:16px;padding:16px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);position:relative;overflow:hidden}
.guide-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.3}
.guide-panel-title{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.guide-panel-sub{font-size:11px;font-weight:400;color:var(--text-muted)}
.guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.guide-grid{grid-template-columns:1fr}}
.guide-card{padding:14px;border-radius:10px;background:rgba(0,212,170,.05);border:1px solid rgba(0,212,170,.15);transition:all .25s}
.guide-card:hover{border-color:rgba(0,212,170,.4);box-shadow:var(--glow)}
.guide-head{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.4}
.guide-body{font-size:12.5px;color:var(--text-dim);line-height:1.7}
.guide-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.guide-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(0,212,170,.12);color:var(--accent)}

/* SECTION: market */
.market-section{grid-column:1/-1}
.market-tabs{display:flex;gap:6px;margin-bottom:16px}
.market-tab{padding:6px 16px;border-radius:8px;border:1px solid var(--card-border);background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;transition:all .25s}
.market-tab:hover{border-color:var(--accent)}
.market-tab.active{background:var(--accent);border-color:var(--accent);color:#0a0e17;font-weight:600}

.market-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:16px}
@media(max-width:1024px){.market-grid{grid-template-columns:1fr}}

.indices-panel{display:flex;flex-direction:column;gap:10px}
.index-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius)}
.index-name{font-size:13px;color:var(--text-dim)}
.index-value{font-size:18px;font-weight:700;font-family:'Courier New',monospace}
.index-change{font-size:14px;font-weight:600;font-family:'Courier New',monospace;padding:3px 8px;border-radius:6px}
.index-change.up{color:var(--up);background:rgba(255,77,77,.1)}
.index-change.down{color:var(--down);background:rgba(0,200,83,.1)}

.heatmap-panel{display:flex;flex-direction:column;gap:8px}
.heatmap-title{font-size:13px;color:var(--text-dim);margin-bottom:4px}
.heatmap-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.heat-cell{padding:10px 6px;border-radius:8px;text-align:center;transition:all .3s}
.heat-cell .heat-name{font-size:11px;color:rgba(255,255,255,.8);margin-bottom:3px}
.heat-cell .heat-val{font-size:14px;font-weight:700;font-family:'Courier New',monospace}

.alerts-panel{grid-column:1/-1;display:flex;flex-direction:column;gap:10px}
@media(min-width:1025px){.alerts-panel .alert-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}}
.alert-item{padding:12px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);border-left:3px solid var(--warn)}
.alert-text{font-size:13px;color:var(--text);margin-bottom:4px}
.alert-reason{font-size:11px;color:var(--text-muted)}

/* SECTION: portfolio */
.portfolio-placeholder{grid-column:1/-1;margin-top:16px}
.portfolio-box{padding:20px;background:var(--card);border:1px dashed var(--card-border);border-radius:var(--radius);text-align:center;color:var(--text-muted);font-size:13px}
.portfolio-box .pp-icon{font-size:28px;margin-bottom:8px;opacity:.4}
.portfolio-box .pp-hint{margin-top:6px;font-size:12px;color:var(--text-muted);opacity:.6}

/* SECTION: responsive */
@media(max-width:768px){
  .header{padding:12px 16px}
  .main{padding:12px 16px;gap:14px}
  .heatmap-grid{grid-template-columns:repeat(3,1fr)}
  .market-grid{gap:12px}
  .track-tabs{gap:6px}
  .track-tab{padding:5px 10px;font-size:11px}
}
@media(max-width:480px){
  .heatmap-grid{grid-template-columns:repeat(2,1fr)}
  .logo-text{font-size:16px}
}

/* SECTION: animations */
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
</style>
</head>
<body>

<!-- SECTION: ticker -->
<div class="ticker-wrap">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<!-- SECTION: header -->
<header class="header">
  <div class="logo-area">
    <div class="logo-icon">搞</div>
    <div>
      <div class="logo-text">搞钱<span>看板</span></div>
      <div class="clock" id="clock"></div>
      <div class="section-nav">
        <div class="nav-chip" data-target="secNews"><span class="nav-dot" style="background:var(--accent)"></span>今日赛道动态</div>
        <div class="nav-chip" data-target="secInterpret"><span class="nav-dot" style="background:var(--warn)"></span>今天发生了什么 · 信息解读</div>
        <div class="nav-chip" data-target="secMarket"><span class="nav-dot" style="background:#ff4d4d"></span>今日行情速报</div>
        <div class="nav-chip" data-target="secAlerts"><span class="nav-dot" style="background:#0088ff"></span>异动提醒</div>
      </div>
    </div>
  </div>
  <div class="track-tabs" id="trackTabs"></div>
</header>

<!-- SECTION: search -->
<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input id="searchInput" type="text" placeholder="搜索任意板块，如：白酒、医药、券商、银行、军工、稀土、煤炭、旅游、农业、AI…" autocomplete="off">
    <button class="search-clear" id="searchClear">✕ 返回科技看板</button>
  </div>
  <div class="search-suggest" id="searchSuggest"></div>
  <div class="search-mode-tag" id="searchModeTag">
    <span id="searchModeText"></span>
    <span class="smt-exit" id="searchModeExit">退出搜索，返回默认四大赛道</span>
  </div>
</div>

<!-- SECTION: main -->
<div class="main">
  <!-- 赛道动态 -->
  <div class="section-track-news" id="secNews">
    <div class="section-title"><span class="dot"></span>今日赛道动态</div>
    <div id="trackNewsContainer"></div>
  </div>

  <!-- 白话解读 -->
  <div class="section-interpret" id="secInterpret">
    <div class="section-title"><span class="dot" style="background:var(--warn);box-shadow:0 0 8px var(--warn)"></span>今天发生了什么 · 信息解读</div>
    <div id="interpretContainer"></div>
  </div>

  <!-- 行情速报 -->
  <div class="market-section" id="secMarket">
    <div class="section-title"><span class="dot" style="background:#ff4d4d;box-shadow:0 0 8px #ff4d4d"></span>今日行情速报</div>
    <div class="market-tabs" id="marketTabs"></div>
    <div class="market-grid" id="marketGrid"></div>
  </div>

  <!-- 持仓关联 -->
  <div class="portfolio-placeholder">
    <div class="portfolio-box">
      <div class="pp-icon">📊</div>
      <div>暂未设置持仓信息</div>
      <div class="pp-hint">配置持仓后，行情总结将自动关联分析你的持仓板块表现</div>
    </div>
  </div>
</div>

<script>

const state = {
  activeTracks: new Set(TRACKS),
  activeMarketTab: '盘前 9:00',
  searchSector: null,
  searchMode: null // 'db' | 'tech'
};

function clearSearch() {
  state.searchSector = null;
  state.searchMode = null;
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').classList.remove('show');
  document.getElementById('searchModeTag').classList.remove('show');
  document.getElementById('searchSuggest').classList.remove('open');
  renderTrackTabs();
  renderTrackNews();
  renderInterpret();
  renderMarketTabs();
  renderMarketContent();
}

function resolveTarget(name) {
  return (name in SEARCH_DB) ? { name, mode: 'db' } : { name, mode: 'tech' };
}

function resolveSearch(q) {
  q = q.trim();
  if (!q) return null;
  if (SEARCH_DB[q]) return { name: q, mode: 'db' };
  if (SEARCH_ALIASES[q]) return resolveTarget(SEARCH_ALIASES[q]);
  for (const key of Object.keys(SEARCH_DB)) {
    if (key.includes(q) || q.includes(key.split('/')[0])) return { name: key, mode: 'db' };
  }
  for (const t of TRACKS) {
    if (t.includes(q) || q.includes(t.split('/')[0])) return { name: t, mode: 'tech' };
  }
  const hit = Object.keys(SEARCH_ALIASES).find(a => a.includes(q) || q.includes(a));
  if (hit) return resolveTarget(SEARCH_ALIASES[hit]);
  return null;
}

function applySearch(rawQuery) {
  const r = resolveSearch(rawQuery);
  const suggest = document.getElementById('searchSuggest');
  if (!r) {
    suggest.innerHTML = '<div class="sg-empty">没有找到相关板块，试试输入：白酒 / 医药 / 券商 / 银行 / 地产 / 军工 / 稀土 / 煤炭 / 旅游 / 农业</div>';
    suggest.classList.add('open');
    return;
  }
  suggest.classList.remove('open');
  state.searchSector = r.name;
  state.searchMode = r.mode;
  document.getElementById('searchClear').classList.add('show');
  const tag = document.getElementById('searchModeTag');
  tag.classList.add('show');
  document.getElementById('searchModeText').textContent =
    `正在查看「${r.name}」的全量看板信息（动态 · 解读 · 行情 · 异动）`;
  renderTrackTabs();
  renderTrackNews();
  renderInterpret();
  renderMarketTabs();
  renderMarketContent();
  document.getElementById('secNews').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// SECTION: clock
function updateClock() {
  const now = new Date();
  const opts = { year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false };
  document.getElementById('clock').textContent = now.toLocaleString('zh-CN', opts);
}
setInterval(updateClock, 1000);
updateClock();

// SECTION: ticker
function renderTicker() {
  const track = document.getElementById('tickerTrack');
  const items = [...TICKER_DATA, ...TICKER_DATA];
  track.innerHTML = items.map(t => {
    const isUp = t.change.startsWith('+');
    return `<div class="ticker-item">
      <span class="t-name">${t.name}</span>
      <span class="t-val">${t.value}</span>
      <span class="t-chg ${isUp ? 't-up' : 't-down'}">${t.change}</span>
    </div>`;
  }).join('');
}

// SECTION: track tabs
function renderTrackTabs() {
  const container = document.getElementById('trackTabs');
  container.innerHTML = TRACKS.map(t => {
    const active = state.activeTracks.has(t);
    return `<button class="track-tab ${active ? 'active' : ''}" data-track="${t}" data-primary-action="toggle-track">
      <span class="tab-icon">${TRACK_ICONS[t]}</span>${t}
    </button>`;
  }).join('');
  container.querySelectorAll('.track-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = btn.dataset.track;
      if (state.searchSector) {
        state.searchSector = null;
        state.searchMode = null;
        state.activeTracks = new Set([t]);
        document.getElementById('searchInput').value = '';
        document.getElementById('searchClear').classList.remove('show');
        document.getElementById('searchModeTag').classList.remove('show');
      } else if (state.activeTracks.has(t)) {
        if (state.activeTracks.size > 1) state.activeTracks.delete(t);
      } else {
        state.activeTracks.add(t);
      }
      renderTrackTabs();
      renderTrackNews();
      renderInterpret();
      renderMarketTabs();
      renderMarketContent();
    });
  });
}

      <div class="card">
        ${items.map(n => `<div class="news-item">
          <div class="news-type-icon type-${n.type}">${typeIcons[n.type]}</div>
          <div class="news-content">
            <div class="news-title ${n.highlight ? 'highlight' : ''}">${n.title}</div>
            <div class="news-meta">
              <span>${typeLabels[n.type]}</span>
              <span>${n.source}</span>
              <span>${n.time}</span>
            </div>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  if (state.searchSector && state.searchMode === 'db') {
    const d = SEARCH_DB[state.searchSector];
    container.innerHTML = newsGroup(state.searchSector, d.icon, d.news);
    return;
  }
  if (state.searchSector && state.searchMode === 'tech') {
    const items = NEWS_DATA[state.searchSector] || [];
    container.innerHTML = newsGroup(state.searchSector, TRACK_ICONS[state.searchSector], items);
    return;
  }
  let html = '';
  TRACKS.forEach(track => {
    if (!state.activeTracks.has(track)) return;
    const items = NEWS_DATA[track] || [];
    html += newsGroup(track, TRACK_ICONS[track], items);
  });
  container.innerHTML = html;
}

// SECTION: interpret
const SOURCE_KINDS = {
  origin:    { label: '原始出处', badge: 'badge-origin' },
  authority: { label: '权威解读', badge: 'badge-authority' },
  hot:       { label: '热门解读', badge: 'badge-hot' }
};

function renderSources(sources) {
  if (!sources || !sources.length) return '';
  if (sources.length === 1) {
    const s = sources[0], k = SOURCE_KINDS[s.kind];
    return `<div class="interpret-section interpret-sources">
      <div class="source-bar">
        <span class="source-label">📎 信息来源</span>
        <a class="source-chip" href="${s.url}" target="_blank" rel="noopener noreferrer" title="点击查看原文：${s.note}">
          <span class="s-kind">${k.label}</span>${s.org}<span class="s-arrow">↗ 查看原文</span>
        </a>
      </div>
    </div>`;
  }
  const primary = sources[0], pk = SOURCE_KINDS[primary.kind];
  const opts = sources.map(s => {
    const k = SOURCE_KINDS[s.kind];
    return `<a class="source-opt" href="${s.url}" target="_blank" rel="noopener noreferrer">
      <div class="so-top"><span class="so-org">${s.org}</span><span class="so-badge ${k.badge}">${k.label}</span></div>
      <div class="so-note">${s.note}</div>
      <div class="so-url">${s.url}</div>
    </a>`;
  }).join('');
  return `<div class="interpret-section interpret-sources">
    <div class="source-bar">
      <span class="source-label">📎 信息来源</span>
      <span class="source-multi">
        <a class="source-chip" href="${primary.url}" target="_blank" rel="noopener noreferrer">
          <span class="s-kind">${pk.label}</span>${primary.org}<span class="s-arrow">↗</span>
        </a>
        <div class="source-dropdown">${opts}</div>
      </span>
      <span style="font-size:11px;color:var(--text-muted)">共 ${sources.length} 处来源 · 悬停选择原文</span>
    </div>
  </div>`;
}

const TRACK_INTERPRET_KEYS = {
  'AI/大模型': ['AI', '大模型'],
  '半导体/芯片': ['光刻', '半导体', '芯片'],
  '新能源/电动车': ['电动车', '关税', '固态电池'],
  '消费电子/硬件': ['Vision', '消费电子', '手机']
};

function interpretCard(d) {
  return `
    <div class="card interpret-card ${d.type} fade-in">
      <div class="interpret-title">${d.title}</div>
      <div class="interpret-section">
        <div class="interpret-label">💬 信息解读</div>
        <div class="interpret-plain">${d.plainWords}</div>
      </div>
      <div class="interpret-section">
        <div class="interpret-label">🎯 影响谁</div>
        <div class="interpret-tags">${d.impact.map(i => `<span class="interpret-tag">${i}</span>`).join('')}</div>
      </div>
      <div class="interpret-section">
        <div class="interpret-label">🔮 接下来可能</div>
        <div class="interpret-outlook">${d.outlook}</div>
      </div>
      ${renderSources(d.sources)}
    </div>`;
}

function renderInterpret() {
  const container = document.getElementById('interpretContainer');
  if (state.searchSector && state.searchMode === 'db') {
    const d = SEARCH_DB[state.searchSector];
    container.innerHTML = (d.interpret || []).map(interpretCard).join('') ||
      `<div class="sg-empty" style="padding:24px">「${state.searchSector}」今日暂无专项解读</div>`;
    return;
  }
  if (state.searchSector && state.searchMode === 'tech') {
    const keys = TRACK_INTERPRET_KEYS[state.searchSector] || [];
    const hits = INTERPRET_DATA.filter(d => keys.some(k => (d.title + ',' + d.impact.join(',')).includes(k)));
    container.innerHTML = hits.length
      ? hits.map(interpretCard).join('')
      : `<div class="sg-empty" style="padding:24px">「${state.searchSector}」今日暂无专项解读，以下为全局重点</div>` + INTERPRET_DATA.map(interpretCard).join('');
    return;
  }
  container.innerHTML = INTERPRET_DATA.map(interpretCard).join('');
}

// SECTION: market
function getHeatColor(change) {
  if (change >= 3) return 'rgba(255,77,77,.55)';
  if (change >= 1) return 'rgba(255,77,77,.3)';
  if (change > 0) return 'rgba(255,77,77,.15)';
  if (change > -1) return 'rgba(0,200,83,.15)';
  if (change > -3) return 'rgba(0,200,83,.3)';
  return 'rgba(0,200,83,.55)';
}

function renderMarketTabs() {
  const container = document.getElementById('marketTabs');
  if (state.searchSector && state.searchMode === 'db') {
    container.innerHTML = `<button class="market-tab active" disabled style="cursor:default">实时快照（${state.searchSector}）</button>`;
    return;
  }
  const tabs = Object.keys(MARKET_DATA);
  container.innerHTML = tabs.map(t => `<button class="market-tab ${t === state.activeMarketTab ? 'active' : ''}" data-tab="${t}">${t}</button>`).join('');
  container.querySelectorAll('.market-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeMarketTab = btn.dataset.tab;
      renderMarketTabs();
      renderMarketContent();
    });
  });
}

function currentMarketData() {
  if (state.searchSector && state.searchMode === 'db') return SEARCH_DB[state.searchSector].market;
  return MARKET_DATA[state.activeMarketTab];
}

function currentHeatmapTitle() {
  if (state.searchSector && state.searchMode === 'db') return `${state.searchSector} 关联板块涨跌`;
  return '科技板块涨跌热力图';
}

function renderMarketContent() {
  const grid = document.getElementById('marketGrid');
  const data = currentMarketData();
  if (!data) return;

  const indicesHtml = data.indices.map(idx => {
    const isUp = idx.change >= 0;
    return `<div class="index-row fade-in">
      <span class="index-name">${idx.name}</span>
      <span class="index-value ${isUp ? 't-up' : 't-down'}">${idx.value.toFixed(2)}</span>
      <span class="index-change ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${idx.change.toFixed(2)}%</span>
    </div>`;
  }).join('');

  const heatmapHtml = data.sectors.map(s => `
    <div class="heat-cell fade-in" style="background:${getHeatColor(s.change)}">
      <div class="heat-name">${s.name}</div>
      <div class="heat-val ${s.change >= 0 ? 't-up' : 't-down'}">${s.change >= 0 ? '+' : ''}${s.change.toFixed(1)}%</div>
    </div>
  `).join('');

  const alertsHtml = data.alerts.map(a => `
    <div class="alert-item fade-in">
      <div class="alert-text">${a.text}</div>
      <div class="alert-reason">📌 ${a.reason}</div>
      ${renderSources(a.sources)}
    </div>
  `).join('');

  const guideHtml = (data.plainGuide || []).map(g => `
    <div class="guide-card fade-in">
      <div class="guide-head">💡 ${g.head}</div>
      <div class="guide-body">${g.body}</div>
      <div class="guide-tags">${g.tags.map(t => `<span class="guide-tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');

  grid.innerHTML = `
    <div class="indices-panel">${indicesHtml}</div>
    <div class="heatmap-panel">
      <div class="heatmap-title">${currentHeatmapTitle()}</div>
      <div class="heatmap-grid">${heatmapHtml}</div>
    </div>
    <div class="guide-panel">
      <div class="guide-panel-title">🔆 小白解读 <span class="guide-panel-sub">不说黑话，直接把今天的行情翻译给你听</span></div>
      <div class="guide-grid">${guideHtml}</div>
    </div>
    <div class="alerts-panel" id="secAlerts">
      <div class="heatmap-title">异动提醒</div>
      <div class="alert-list">${alertsHtml}</div>
    </div>
  `;
}

// SECTION: search binding
function allSearchableSectors() {
  return [...Object.keys(SEARCH_DB), ...TRACKS];
}

function renderSuggest(q) {
  const suggest = document.getElementById('searchSuggest');
  if (!q.trim()) { suggest.classList.remove('open'); return; }
  const r = resolveSearch(q);
  const list = allSearchableSectors().filter(s => s.includes(q.trim()) || Object.keys(SEARCH_ALIASES).some(a => SEARCH_ALIASES[a] === s && a.includes(q.trim())));
  if (r && list.length === 0) list.push(r.name);
  if (!list.length) {
    suggest.innerHTML = '<div class="sg-empty">没有找到匹配板块，可输入：白酒 / 医药 / 券商 / 银行 / 地产 / 军工 / 稀土 / 煤炭 / 旅游 / 农业</div>';
  } else {
    const icons = n => (n in SEARCH_DB ? SEARCH_DB[n].icon : TRACK_ICONS[n]) || '📊';
    suggest.innerHTML = list.slice(0, 8).map(s => {
      const alias = Object.keys(SEARCH_ALIASES).find(a => SEARCH_ALIASES[a] === s && a.includes(q.trim()) && a !== s);
      return `<div class="sg-item" data-name="${s}"><span class="sg-icon">${icons(s)}</span><span class="sg-name">${s}</span>${alias ? `<span class="sg-alias">匹配"${q.trim()}"</span>` : ''}</div>`;
    }).join('');
    suggest.querySelectorAll('.sg-item').forEach(it => {
      it.addEventListener('click', () => {
        document.getElementById('searchInput').value = it.dataset.name;
        applySearch(it.dataset.name);
      });
    });
  }
  suggest.classList.add('open');
}

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => renderSuggest(searchInput.value));
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') applySearch(searchInput.value);
  if (e.key === 'Escape') clearSearch();
});
document.getElementById('searchClear').addEventListener('click', clearSearch);
document.getElementById('searchModeExit').addEventListener('click', clearSearch);
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) document.getElementById('searchSuggest').classList.remove('open');
});

// SECTION: init
renderTicker();
// SECTION: section nav
function initSectionNav() {
  document.querySelectorAll('.nav-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const el = document.getElementById(chip.dataset.target);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}
initSectionNav();

renderTrackTabs();
renderTrackNews();
renderInterpret();
renderMarketTabs();
renderMarketContent();
</script>
</body>
</html>
